name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-regression:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install target-acquisition dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
          python -m pip install --disable-pip-version-check -r scirepro/requirements.txt
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
