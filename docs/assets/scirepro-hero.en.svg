<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">SciRepro: from published figures back to the research process</title>
  <desc id="desc">SciRepro connects figure interpretation, generation-chain reconstruction, route design, and scientific validation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1321"/>
      <stop offset="1" stop-color="#151d31"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#73a7ff"/>
      <stop offset="1" stop-color="#63dfd4"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#02050b" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1440" height="520" rx="30" fill="url(#bg)"/>
  <rect width="1440" height="520" rx="30" fill="url(#grid)"/>
  <circle cx="1320" cy="34" r="180" fill="#4b7bec" opacity="0.08"/>
  <circle cx="1180" cy="500" r="220" fill="#38c4bb" opacity="0.055"/>

  <g transform="translate(82 70)">
    <rect width="54" height="54" rx="15" fill="url(#accent)"/>
    <text x="27" y="35" text-anchor="middle" fill="#0d1321" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="800">SR</text>
    <text x="72" y="23" fill="#f6f8fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="28" font-weight="750">SciRepro</text>
    <text x="73" y="47" fill="#8f9db3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="650" letter-spacing="2.4">SCIENTIFIC FIGURE REPRODUCTION</text>
  </g>

  <g transform="translate(82 176)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="0" y="0" fill="#f6f8fc" font-size="43" font-weight="760">From figure to research process</text>
    <text x="0" y="48" fill="#aab5c7" font-size="19">Interpret the evidence. Reconstruct the chain. Validate the science.</text>

    <g transform="translate(0 100)">
      <rect width="140" height="38" rx="19" fill="#73a7ff" fill-opacity="0.12" stroke="#73a7ff" stroke-opacity="0.34"/>
      <text x="70" y="25" text-anchor="middle" fill="#9dc0ff" font-size="14" font-weight="650">01 INTERPRET</text>
      <path d="M150 19h22" stroke="#526078" stroke-width="1.5"/>
      <rect x="182" width="150" height="38" rx="19" fill="#73a7ff" fill-opacity="0.12" stroke="#73a7ff" stroke-opacity="0.34"/>
      <text x="257" y="25" text-anchor="middle" fill="#9dc0ff" font-size="14" font-weight="650">02 RECONSTRUCT</text>
      <path d="M342 19h22" stroke="#526078" stroke-width="1.5"/>
      <rect x="374" width="140" height="38" rx="19" fill="#63dfd4" fill-opacity="0.11" stroke="#63dfd4" stroke-opacity="0.34"/>
      <text x="444" y="25" text-anchor="middle" fill="#8ce9e1" font-size="14" font-weight="650">03 PLAN</text>
      <path d="M524 19h22" stroke="#526078" stroke-width="1.5"/>
      <rect x="556" width="140" height="38" rx="19" fill="#63dfd4" fill-opacity="0.11" stroke="#63dfd4" stroke-opacity="0.34"/>
      <text x="626" y="25" text-anchor="middle" fill="#8ce9e1" font-size="14" font-weight="650">04 VALIDATE</text>
    </g>

    <line x1="0" y1="174" x2="696" y2="174" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="0" y="215" fill="#dbe2ed" font-size="17" font-weight="620">Reproduce the process behind the figure—not its pixels.</text>
  </g>

  <g transform="translate(850 64)" filter="url(#shadow)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect width="500" height="180" rx="22" fill="#192235" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="24" y="31" fill="#8190a8" font-size="11" font-weight="700" letter-spacing="1.8">TARGET FIGURE · EVIDENCE</text>
    <text x="24" y="57" fill="#eff3f9" font-size="16" font-weight="680">Does windowed initialization accelerate locking?</text>
    <line x1="34" y1="145" x2="468" y2="145" stroke="#76849a" stroke-opacity="0.55"/>
    <line x1="34" y1="78" x2="34" y2="145" stroke="#76849a" stroke-opacity="0.55"/>
    <path d="M34 133 C70 124 82 90 118 92 S168 98 200 86 S250 90 286 67 S344 77 378 53 S430 65 468 38" fill="none" stroke="#73a7ff" stroke-width="4" stroke-linecap="round"/>
    <path d="M34 126 C76 123 105 125 142 112 S203 113 244 101 S313 106 352 91 S416 96 468 80" fill="none" stroke="#63dfd4" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 8"/>
    <circle cx="378" cy="53" r="5" fill="#73a7ff"/>
    <circle cx="352" cy="91" r="4" fill="#63dfd4"/>
  </g>

  <g transform="translate(818 276)" filter="url(#shadow)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect width="532" height="176" rx="22" fill="#f5f7fb"/>
    <text x="24" y="32" fill="#667085" font-size="11" font-weight="750" letter-spacing="1.8">GENERATION CHAIN</text>

    <g transform="translate(24 54)">
      <rect width="100" height="62" rx="14" fill="#e8efff"/>
      <text x="50" y="27" text-anchor="middle" fill="#2f5fb8" font-size="12" font-weight="700">INPUT</text>
      <text x="50" y="46" text-anchor="middle" fill="#6b7b94" font-size="10">paper</text>
      <path d="M110 31h22" stroke="#aab5c7" stroke-width="2"/>
      <path d="m128 27 6 4-6 4" fill="none" stroke="#aab5c7" stroke-width="2"/>

      <rect x="144" width="100" height="62" rx="14" fill="#e8efff"/>
      <text x="194" y="27" text-anchor="middle" fill="#2f5fb8" font-size="12" font-weight="700">METHOD</text>
      <text x="194" y="46" text-anchor="middle" fill="#6b7b94" font-size="10">code</text>
      <path d="M254 31h22" stroke="#aab5c7" stroke-width="2"/>
      <path d="m272 27 6 4-6 4" fill="none" stroke="#aab5c7" stroke-width="2"/>

      <rect x="288" width="100" height="62" rx="14" fill="#e6f7f4"/>
      <text x="338" y="27" text-anchor="middle" fill="#237b73" font-size="12" font-weight="700">ASSUME</text>
      <text x="338" y="46" text-anchor="middle" fill="#6b7b94" font-size="10">derived</text>
      <path d="M398 31h22" stroke="#aab5c7" stroke-width="2"/>
      <path d="m416 27 6 4-6 4" fill="none" stroke="#aab5c7" stroke-width="2"/>

      <rect x="432" width="76" height="62" rx="14" fill="#14273b"/>
      <text x="470" y="27" text-anchor="middle" fill="#8ce9e1" font-size="12" font-weight="700">TEST</text>
      <text x="470" y="46" text-anchor="middle" fill="#a7b4c7" font-size="10">verified</text>
    </g>

    <text x="24" y="148" fill="#536176" font-size="12">Paper, code, data, assumptions, and local capability—one auditable route.</text>
  </g>
</svg>
